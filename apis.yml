name: TubeMogul
description: 'TubeMogul was an independent video advertising software platform — a demand-side
  platform for planning, buying, measuring and optimizing programmatic brand video campaigns
  across desktop, mobile, connected TV and out-of-home. Founded 2006 in Emeryville, California,
  it IPO''d on NASDAQ in 2014 and was acquired by Adobe in 2016, then folded into Adobe
  Advertising Cloud. It ran an Ad Platform API at api.tubemogul.com for partner reporting and
  campaign management; that host is now dark and no independent developer surface remains.'
